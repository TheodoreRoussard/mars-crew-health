name: Release

# Delivery for an offline tool: a tagged version becomes a zip to copy onto the USB sticks,
# with checksums so the crew can verify the copy.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Run every check before publishing
        run: npm test
      - name: Build the USB bundle
        run: |
          set -euo pipefail
          name="crew-health-monitor-${GITHUB_REF_NAME}"
          mkdir "$name"
          cp index.html sample-data.json SETUP.md RATIONALE.md "$name/"
          (cd "$name" && sha256sum index.html sample-data.json SETUP.md RATIONALE.md > SHA256SUMS)
          zip -r "$name.zip" "$name"
          sha256sum "$name.zip" > "$name.zip.sha256"
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="crew-health-monitor-${GITHUB_REF_NAME}"
          gh release create "$GITHUB_REF_NAME" "$name.zip" "$name.zip.sha256" \
            --title "Crew Health Monitor ${GITHUB_REF_NAME}" --generate-notes
