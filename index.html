<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crew Health Monitor</title>
<style>
:root{
  --bg:#0a0f14; --panel:#141c25; --panel2:#1d2835; --line:#30404f;
  --text:#eef3f7; --dim:#aab7c4;
  --nominal:#4ade80; --watch:#fbbf24; --act:#ff6b5e; --nodata:#9aa7b4; --focus:#7cc4ff;
}
*{box-sizing:border-box}
html{font-size:clamp(14px,min(1.5vw,2.6vh),32px)}
body{margin:0;background:var(--bg);color:var(--text);height:100vh;overflow:hidden;
  font-family:system-ui,-apple-system,"Segoe UI","DejaVu Sans","Liberation Sans",Arial,sans-serif;line-height:1.25}
.st-nominal{--c:var(--nominal)} .st-watch{--c:var(--watch)} .st-act{--c:var(--act)} .st-nodata{--c:var(--nodata)}
#app{display:flex;flex-direction:column;height:100vh}
header{display:flex;align-items:center;gap:1.2rem;height:2.6rem;padding:0 1rem;background:var(--panel);border-bottom:2px solid var(--line);flex:none}
header .brand{font-weight:700;letter-spacing:.06em}
header .who{font-weight:700}
header .sp{flex:1}
header .dim{color:var(--dim)}
.chip{display:inline-flex;align-items:center;gap:.4rem;padding:.1rem .7rem;border:2px solid var(--c);border-radius:1rem;color:var(--c);font-weight:700;text-transform:uppercase}
.ico{width:1.3em;height:1.3em;flex:none;vertical-align:middle}
.alarm{display:flex;flex-wrap:wrap;align-items:center;gap:.1rem .8rem;padding:.25rem 1rem;border:3px solid var(--c);background:#000;color:var(--c);font-weight:700;font-size:1.05rem;flex:none}
.alarm.live{cursor:pointer}
.alarm.live.st-act{animation:blink 1s steps(2,start) infinite}
.alarm .do{color:var(--text);font-weight:600;font-size:.95rem}
@keyframes blink{50%{border-color:#000}}
.alarm .sp{flex:1}
.notice{padding:.25rem 1rem;background:var(--panel2);border-bottom:1px solid var(--line);color:var(--text);flex:none}
.notice b{color:var(--watch)}
main{flex:1;min-height:0;padding:.6rem 1rem;display:flex;flex-direction:column;gap:.5rem}
footer{display:flex;flex-wrap:wrap;align-items:center;gap:.25rem 1rem;min-height:2.2rem;padding:.2rem 1rem;background:var(--panel);border-top:2px solid var(--line);font-size:.82rem;color:var(--dim);flex:none}
footer span{cursor:pointer;white-space:nowrap}
footer .on{color:var(--text);font-weight:700}
footer .sep{flex:1}
kbd{display:inline-block;min-width:1.5em;text-align:center;padding:0 .35em;border:1px solid var(--dim);border-radius:.3em;color:var(--text);font-family:inherit;font-size:.9em;margin-right:.25em}
h1{font-size:1.5rem;margin:0}
h2{font-size:1rem;margin:0;color:var(--dim);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.hero{display:flex;align-items:center;gap:1.2rem;padding:.8rem 1.2rem;background:var(--panel);border-left:.7rem solid var(--c);border-radius:.4rem;flex:none}
.hero .ico{width:5rem;height:5rem}
.hero-title{font-size:2.6rem;font-weight:800;color:var(--c);line-height:1.05}
.hero-sub{font-size:1.3rem;font-weight:600}
.hero-do{font-size:1.3rem;margin-top:.2rem}
.hero-who{color:var(--dim)}
.cols{display:flex;gap:1rem;flex:1;min-height:0}
.cols>.list{flex:1.6}
.cols>aside,.cols>.side{flex:1;min-width:0;display:flex;flex-direction:column;gap:.5rem}
.list{overflow:auto;min-height:0}
.row{display:flex;align-items:center;gap:.6rem;padding:.12rem .5rem;border:2px solid transparent;border-radius:.35rem;cursor:pointer;font-size:.95rem}
.row.sel{border-color:var(--focus);background:var(--panel2)}
.row .r-label{flex:1.2;font-weight:600;min-width:0}
.row .r-word{flex:1.5;color:var(--c);font-weight:700;min-width:0}
.row .r-val{flex:.8;color:var(--dim);text-align:right;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.big{font-size:1.15rem;padding:.45rem .7rem}
.compact .row{font-size:.9rem}
.compact .r-val{display:none}
.compact .r-label,.compact .r-word{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grp{display:flex;align-items:center;gap:.5rem;padding:.25rem .3rem .05rem;color:var(--dim);font-size:.8rem;font-weight:700;text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--line)}
.grp .g-word{color:var(--c)}
.box{background:var(--panel);border-radius:.4rem;padding:.6rem .8rem}
.count{display:flex;align-items:center;gap:.5rem;font-size:1.05rem;color:var(--c);font-weight:700}
.count span{color:var(--text);font-weight:400}
.card{flex:1;min-height:0;display:flex;flex-direction:column;gap:.5rem}
.card-top{display:flex;align-items:center;gap:.8rem;padding:.5rem .9rem;background:var(--panel);border-left:.7rem solid var(--c);border-radius:.4rem}
.card-top .ico{width:3rem;height:3rem}
.card-status{font-size:2rem;font-weight:800;color:var(--c);text-transform:uppercase}
.card-name{font-size:1.4rem;font-weight:700}
.card-risk{color:var(--dim);font-size:.85rem}
.card-grid{display:flex;gap:1rem;flex:1;min-height:0}
.card-grid>div{flex:1;min-width:0;display:flex;flex-direction:column;gap:.45rem}
.level{font-size:2.2rem;font-weight:800;color:var(--c);line-height:1.1}
.value{font-size:1.5rem;font-weight:600}
.value small{font-size:.95rem;color:var(--dim);font-weight:400}
.meta{font-size:1.05rem;display:flex;align-items:center;gap:.4rem}
.why{color:var(--dim);font-size:1rem}
.action{border:3px solid var(--c);border-radius:.4rem;padding:.5rem .8rem;background:var(--panel)}
.action-h{font-size:.8rem;font-weight:800;letter-spacing:.08em;color:var(--c)}
.action-t{font-size:1.35rem;font-weight:700}
.action-w{font-size:1rem;margin-top:.15rem}
.delay{margin-top:.35rem;padding-top:.35rem;border-top:1px solid var(--line);font-size:.92rem}
.chart{background:var(--panel);border-radius:.4rem;padding:.3rem;flex:1;min-height:0;display:flex;flex-direction:column}
.chart svg{width:100%;flex:1;min-height:0}
.chart-cap{font-size:.78rem;color:var(--dim);padding:0 .4rem}
.nochart{color:var(--dim);padding:1rem;font-size:1.1rem}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.7rem;text-align:center;min-height:0}
.center .list{width:min(46rem,92vw);flex:none;max-height:55vh;text-align:left}
.title-xl{font-size:2.4rem;font-weight:800;letter-spacing:.04em}
.lead{font-size:1.25rem;color:var(--dim);max-width:44rem}
.how{font-size:1.4rem;max-width:44rem}
.step{color:var(--dim);font-weight:700;letter-spacing:.05em;text-transform:uppercase}
.inp{font:inherit;font-size:2.4rem;font-weight:700;width:9em;text-align:center;background:#000;color:var(--text);border:3px solid var(--focus);border-radius:.4rem;padding:.2rem .4rem}
.inp:focus{outline:none;box-shadow:0 0 0 3px #7cc4ff55}
.unit{font-size:1.6rem;color:var(--dim)}
.err{color:var(--watch);font-size:1.15rem;font-weight:700;min-height:1.5em}
.msg{padding:.3rem .8rem;border-left:.4rem solid var(--focus);background:var(--panel2);font-size:1rem;flex:none}
.msg.bad{border-color:var(--watch)}
.veil{position:fixed;inset:0;background:#000c;display:flex;align-items:center;justify-content:center;z-index:5}
.dialog{background:var(--panel);border:3px solid var(--focus);border-radius:.5rem;padding:1.2rem 1.5rem;width:min(40rem,92vw);display:flex;flex-direction:column;gap:.7rem;align-items:flex-start}
.dialog .inp{font-size:1.6rem;width:100%;text-align:left}
.body-svg{height:100%;max-height:100%;flex:none}
.body-wrap{flex:.55;display:flex;align-items:center;justify-content:center;min-height:0}
.reg{fill:var(--c);fill-opacity:.3;stroke:var(--c);stroke-width:3}
.reg.on{stroke:#fff;stroke-width:6;fill-opacity:.55}
#crash{position:fixed;inset:0;z-index:9;background:#000;color:var(--text);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;font-size:1.5rem;text-align:center;padding:2rem}
#crash[hidden]{display:none}
/* multi-line prose gets more leading; single-line rows and headlines stay compact to fit 720p */
.why,.how,.lead,.delay,.box,.hero-do,.dialog>div,.msg,.notice{line-height:1.45}
</style>
</head>
<body>
<div id="app"><noscript>This tool needs JavaScript. Enable it in the browser settings.</noscript></div>
<div id="crash" hidden>
  <div style="font-size:2.2rem;font-weight:800">The screen had a problem</div>
  <div>Your saved measurements are safe.</div>
  <div>Press <kbd>R</kbd> to reload the page (or F5).</div>
  <div style="color:#aab7c4;font-size:1rem">If this keeps happening, follow the backup procedure and use the spare device.</div>
</div>
<input type="file" id="file" accept=".json,application/json" style="display:none">
<script>
'use strict';
/*==CORE-BEGIN==  Pure data and rules. No DOM. Checked separately in Node. */
var APP = 'crew-health-monitor';
var VERSION = 1;
var STATUS = {
  nominal: {word: 'Nominal', rank: 1},
  watch:   {word: 'Watch',   rank: 2},
  act:     {word: 'Act',     rank: 3},
  nodata:  {word: 'No data', rank: 0}
};
var OWNERS = {you: 'You', cmo: 'Crew medical officer', earth: 'Flight surgeons on Earth'};
var REGIONS = [
  {id: 'head',    name: 'Head and eyes'},
  {id: 'heart',   name: 'Heart and lungs'},
  {id: 'muscles', name: 'Muscles, bones and joints'},
  {id: 'immune',  name: 'Immunity, food and gut'}
];
var HAZARDS = [
  {id: 'radiation', name: 'Space radiation'},
  {id: 'closed',    name: 'Hostile closed environment'},
  {id: 'isolation', name: 'Isolation and confinement'},
  {id: 'distance',  name: 'Distance from Earth'},
  {id: 'gravity',   name: 'Altered gravity'}
];
function B(max, s, w) { return {max: max, s: s, w: w}; }
function O(label, s, w) { return {label: label, s: s, w: w}; }
/* Thresholds are ILLUSTRATIVE design values, not validated clinical limits.
   The flight surgeons must replace them before any real use.
   metric: 'abs' = the value itself, 'delta' = value minus baseline, 'pct' = % change from baseline.
   every: how often it is measured (days). eps: smallest change shown as a trend. */
var INDICATORS = [
  {id: 'spo2', label: 'Blood oxygen', region: 'heart', hazard: 'closed', risk: 'Hypoxia',
   type: 'number', unit: '%', dec: 0, min: 50, max: 100, metric: 'abs', every: 1, eps: 1.5,
   bands: [B(89, 'act', 'Very low'), B(93, 'watch', 'Slightly low'), B(Infinity, 'nominal', 'Normal')],
   how: 'Clip the sensor on a warm finger. Stay still for 30 seconds. Type the % number.',
   why: 'Low blood oxygen means the cabin air or your lungs are not giving your body enough oxygen.',
   actions: {watch: {t: 'Move the sensor to another finger and measure again.', who: 'you'},
             act: {t: 'Put on an oxygen mask now, then call the crew.', who: 'you'}}},
  {id: 'hr', label: 'Resting heart rate', region: 'heart', hazard: 'gravity', risk: 'Cardiovascular adaptation',
   type: 'number', unit: 'bpm', dec: 0, min: 25, max: 220, metric: 'delta', every: 1, eps: 4,
   bands: [B(-21, 'act', 'Much lower than your normal'), B(-11, 'watch', 'Lower than your normal'),
           B(10, 'nominal', 'Normal for you'), B(20, 'watch', 'Higher than your normal'),
           B(Infinity, 'act', 'Much higher than your normal')],
   how: 'Rest for 5 minutes first. Read the beats per minute on the finger sensor.',
   why: 'Without gravity the heart and blood vessels change, and a shifted resting pulse is an early sign.',
   actions: {watch: {t: 'Rest for 10 minutes, drink water, then measure again.', who: 'you'},
             act: {t: 'Stop exercise and see the crew medical officer now.', who: 'cmo'}}},
  {id: 'bp', label: 'Blood pressure (top number)', region: 'heart', hazard: 'gravity', risk: 'Cardiovascular adaptation',
   type: 'number', unit: 'mmHg', dec: 0, min: 50, max: 260, metric: 'abs', every: 1, eps: 5,
   bands: [B(89, 'act', 'Very low'), B(99, 'watch', 'Slightly low'), B(134, 'nominal', 'Normal'),
           B(159, 'watch', 'Slightly high'), B(Infinity, 'act', 'Very high')],
   how: 'Put the cuff on your upper arm and press Start. Type the top (larger) number.',
   why: 'Body fluids move toward the head in space, which changes the pressure your heart works against.',
   actions: {watch: {t: 'Stay still and calm for 5 minutes, then measure again.', who: 'you'},
             act: {t: 'See the crew medical officer now.', who: 'cmo'}}},
  {id: 'temp', label: 'Body temperature', region: 'immune', hazard: 'closed', risk: 'Altered immune system',
   type: 'number', unit: '°C', dec: 1, min: 30, max: 43, metric: 'abs', every: 1, eps: 0.3,
   bands: [B(34.9, 'act', 'Very low'), B(35.9, 'watch', 'Slightly low'), B(37.5, 'nominal', 'Normal'),
           B(38.4, 'watch', 'Slight fever'), B(Infinity, 'act', 'High fever')],
   how: 'Use the ear thermometer. Type the number in degrees Celsius, for example 36.8.',
   why: 'The immune system is weaker in space, so a fever can mean an infection is starting.',
   actions: {watch: {t: 'Rest, drink water and measure again in 2 hours.', who: 'you'},
             act: {t: 'See the crew medical officer now and keep away from shared food.', who: 'cmo'}}},
  {id: 'mass', label: 'Body mass', region: 'immune', hazard: 'distance', risk: 'Inadequate food and nutrition',
   type: 'number', unit: 'kg', dec: 1, min: 30, max: 150, metric: 'pct', every: 1, eps: 0.5,
   bands: [B(-10, 'act', 'Much lower than your normal'), B(-5, 'watch', 'Lower than your normal'),
           B(5, 'nominal', 'Normal for you'), B(Infinity, 'watch', 'Higher than your normal')],
   how: 'Use the body mass device before breakfast. Type the number in kilograms.',
   why: 'Losing body mass means you are not eating enough, and no new food can be sent from Earth.',
   actions: {watch: {t: 'Eat every planned meal and add one snack today.', who: 'you'},
             act: {t: 'Send your food log to the flight surgeons.', who: 'earth',
                   wait: 'eat all planned meals plus two snacks a day, and weigh again tomorrow.'}}},
  {id: 'exercise', label: 'Exercise (last 24 hours)', region: 'muscles', hazard: 'gravity',
   risk: 'Cardiorespiratory and musculoskeletal fitness',
   type: 'number', unit: 'min', dec: 0, min: 0, max: 300, metric: 'abs', every: 1, eps: 15,
   bands: [B(59, 'watch', 'Too little'), B(Infinity, 'nominal', 'Enough')],
   how: 'Add up your bike, treadmill and resistance minutes since the last check-in.',
   why: 'Daily exercise is the main protection against losing muscle, bone and heart fitness in space.',
   actions: {watch: {t: 'Plan a full exercise session in the next 24 hours.', who: 'you'}}},
  {id: 'sleep', label: 'Sleep last night', hazard: 'isolation', risk: 'Isolation and confinement',
   type: 'number', unit: 'hours', dec: 1, min: 0, max: 16, metric: 'abs', every: 1, eps: 0.7,
   bands: [B(4.9, 'act', 'Far too little'), B(5.9, 'watch', 'Too little'), B(Infinity, 'nominal', 'Enough')],
   how: 'How many hours did you really sleep? For example 6.5.',
   why: 'Poor sleep in a closed, isolated ship quickly leads to mistakes and low mood.',
   actions: {watch: {t: 'Dim the lights and stop screen use 1 hour before sleep tonight.', who: 'you'},
             act: {t: 'See the crew medical officer before any critical task.', who: 'cmo'}}},
  {id: 'dizzy', label: 'Dizziness and balance', region: 'head', hazard: 'gravity',
   risk: 'Altered sensorimotor and vestibular function', type: 'choice', every: 1, eps: 0.5,
   options: [O('No dizziness', 'nominal', 'None'), O('Some dizziness or clumsy hands', 'watch', 'Mild'),
             O('Strong dizziness, nausea or cannot aim movements', 'act', 'Strong')],
   how: 'Turn your head left and right, then touch your nose with each hand. How do you feel?',
   why: 'The balance organs and movement control re-tune in altered gravity, which can make precise tasks unsafe.',
   actions: {watch: {t: 'Move slowly and avoid quick head turns today.', who: 'you'},
             act: {t: 'Stop precision tasks and see the crew medical officer.', who: 'cmo'}}},
  {id: 'mood', label: 'Mood', hazard: 'isolation', risk: 'Isolation and confinement', type: 'choice', every: 1, eps: 0.5,
   options: [O('Good or normal', 'nominal', 'Good'), O('Low, irritable or withdrawn', 'watch', 'Low'),
             O('Very low or hopeless', 'act', 'Very low')],
   how: 'Think about the last 24 hours. Which line fits best?',
   why: 'Months of isolation and confinement wear down mood, and low mood affects the whole crew.',
   actions: {watch: {t: 'Talk with a crewmate or record a message home today.', who: 'you'},
             act: {t: 'Talk to the crew medical officer today.', who: 'cmo'}}},
  {id: 'immune', label: 'Skin, mouth and wounds', region: 'immune', hazard: 'closed', risk: 'Altered immune system',
   type: 'choice', every: 1, eps: 0.5,
   options: [O('Nothing unusual', 'nominal', 'Clear'), O('Cold sore, rash or a slow-healing cut', 'watch', 'Mild signs'),
             O('Spreading rash, or a hot, swollen wound', 'act', 'Strong signs')],
   how: 'Look at your lips, skin and any cuts. Which line fits best?',
   why: 'A weaker immune system lets old viruses wake up and makes wounds heal slowly.',
   actions: {watch: {t: 'Show it to the crew medical officer at the next meal.', who: 'cmo'},
             act: {t: 'See the crew medical officer today.', who: 'cmo'}}},
  {id: 'gut', label: 'Stomach and gut', region: 'immune', hazard: 'closed', risk: 'Host–microorganism interactions',
   type: 'choice', every: 1, eps: 0.5,
   options: [O('Normal', 'nominal', 'Normal'), O('Bloating, cramps or loose stools', 'watch', 'Upset'),
             O('Vomiting or diarrhoea more than once', 'act', 'Sick')],
   how: 'How has your stomach and gut been in the last 24 hours?',
   why: 'Microbes behave differently in a sealed ship and can upset the balance between you and your gut bacteria.',
   actions: {watch: {t: 'Drink water, eat plain food and wash your hands often.', who: 'you'},
             act: {t: 'See the crew medical officer and use your own hygiene kit.', who: 'cmo'}}},
  {id: 'dcs', label: 'Pressure-change symptoms', region: 'muscles', hazard: 'closed', risk: 'Decompression sickness',
   type: 'choice', every: 1, eps: 0.5,
   options: [O('No symptoms', 'nominal', 'None'), O('Joint ache, tingling or itchy skin', 'watch', 'Mild'),
             O('Strong joint pain, chest pain, trouble breathing or confusion', 'act', 'Severe')],
   how: 'After any suit work or cabin pressure change: do you feel any of these?',
   why: 'When pressure drops, gas bubbles can form in the body and cause decompression sickness.',
   actions: {watch: {t: 'Tell the crew medical officer and check again in 1 hour.', who: 'cmo'},
             act: {t: 'Breathe pure oxygen now and call the crew medical officer.', who: 'cmo'}}},
  {id: 'eva', label: 'Spacewalk and suit injuries', region: 'muscles', hazard: 'closed',
   risk: 'Injury and compromised performance from spacewalks (EVA)', type: 'choice', every: 1, eps: 0.5,
   options: [O('No suit work, or no pain', 'nominal', 'None'), O('Sore hands, shoulders or skin, but able to work', 'watch', 'Minor'),
             O('Pain or injury that limits your work', 'act', 'Limiting')],
   how: 'Check your hands, fingernails, shoulders and skin after suit work.',
   why: 'The stiff pressurised suit strains hands and shoulders, and small injuries get worse with every spacewalk.',
   actions: {watch: {t: 'Show the sore area to the crew medical officer.', who: 'cmo'},
             act: {t: 'Stop suit work and get treated by the crew medical officer.', who: 'cmo'}}},
  {id: 'rad', label: 'Radiation dose (last 24 hours)', hazard: 'radiation', risk: 'Space radiation',
   type: 'number', unit: 'mSv', dec: 1, min: 0, max: 1000, metric: 'abs', every: 1, eps: 0.4,
   bands: [B(2.5, 'nominal', 'Normal for deep space'), B(10, 'watch', 'Elevated'), B(Infinity, 'act', 'Solar storm level')],
   how: 'Read the 24-hour dose on your personal dosimeter. Type the number in mSv.',
   why: 'Outside Earth’s magnetic field you are exposed to radiation that raises long-term health risk.',
   actions: {watch: {t: 'Spend your rest time in the best-shielded area today.', who: 'you'},
             act: {t: 'Go to the storm shelter now and stay until the level drops.', who: 'you'}}},
  {id: 'co2', label: 'Cabin air CO2', hazard: 'closed', risk: 'Hostile closed environment',
   type: 'number', unit: 'mmHg', dec: 1, min: 0, max: 40, metric: 'abs', every: 1, eps: 0.5,
   bands: [B(4, 'nominal', 'Normal'), B(6, 'watch', 'Slightly high'), B(Infinity, 'act', 'Too high')],
   how: 'Read the CO2 number on the cabin air monitor in this room. Type it in mmHg.',
   why: 'In a sealed cabin, carbon dioxide builds up and causes headaches and poor thinking.',
   actions: {watch: {t: 'Check the air scrubber and move to another module.', who: 'you'},
             act: {t: 'Leave this module now and alert the crew.', who: 'you'}}},
  {id: 'vision', label: 'Eyesight', region: 'head', hazard: 'gravity', risk: 'Spaceflight-Associated Neuro-ocular Syndrome (SANS)',
   type: 'choice', every: 7, eps: 0.5,
   options: [O('Same as usual', 'nominal', 'Same as usual'), O('Slightly blurry, near or far', 'watch', 'Slightly worse'),
             O('Much worse, or blind spots', 'act', 'Much worse')],
   how: 'Read the eye chart card at arm’s length, one eye at a time.',
   why: 'Fluid shifting toward the head presses on the back of the eye and can change your vision.',
   actions: {watch: {t: 'Repeat the eye chart tomorrow at the same time.', who: 'you'},
             act: {t: 'Send your eye test and eye scan to the flight surgeons.', who: 'earth',
                   wait: 'rest your eyes, avoid fine close-up work and tell the crew medical officer.'}}},
  {id: 'grip', label: 'Grip strength', region: 'muscles', hazard: 'gravity', risk: 'Cardiorespiratory and musculoskeletal fitness',
   type: 'number', unit: 'kg', dec: 0, min: 5, max: 90, metric: 'pct', every: 7, eps: 2,
   bands: [B(-20, 'act', 'Much weaker than your normal'), B(-10, 'watch', 'Weaker than your normal'),
           B(Infinity, 'nominal', 'Normal for you')],
   how: 'Squeeze the hand grip meter as hard as you can with your stronger hand. Type the kg number.',
   why: 'Muscles shrink when they do not work against gravity, and grip strength shows it early.',
   actions: {watch: {t: 'Add the hand and arm resistance set to your next session.', who: 'you'},
             act: {t: 'Ask the flight surgeons for a new exercise plan.', who: 'earth',
                   wait: 'keep doing your normal exercise sessions and do not add heavy loads on your own.'}}},
  {id: 'ucal', label: 'Urine calcium strip', region: 'muscles', hazard: 'gravity', risk: 'Spaceflight-induced bone changes',
   type: 'choice', every: 7, eps: 0.5,
   options: [O('Strip shows normal', 'nominal', 'Normal'), O('Strip shows high', 'watch', 'High'),
             O('Strip shows very high', 'act', 'Very high')],
   how: 'Dip a calcium test strip in your first urine of the day. Compare it with the colour card.',
   why: 'Bones lose calcium without gravity, and the lost calcium leaves the body in urine.',
   actions: {watch: {t: 'Drink one extra litre of water today.', who: 'you'},
             act: {t: 'Report the strip result to the flight surgeons.', who: 'earth',
                   wait: 'drink extra water and keep doing your resistance exercise.'}}},

function runCommand(cmd) {
  if (cmd === 'export') exportProfile();
  else if (cmd === 'import') { try { fileInput.click(); } catch (e) { say('The file chooser could not open.', true); } }
  else if (cmd === 'switch') endSession();
  else if (cmd === 'new') askNewAstronaut();
  else if (cmd === 'date') askDate();
  else if (cmd === 'tw') { initAudio(); playWatch(); say(audio.ok ? 'Watch sound played: two soft rising notes.' : 'Sound is not available on this device.', !audio.ok); }
  else if (cmd === 'ta') { initAudio(); playAct(); say(audio.ok ? 'Act sound played: fast harsh beeps.' : 'Sound is not available on this device.', !audio.ok); }
}
function handleKey(k, inInput) {
  var isAck = (k === 'a' || k === 'A');
  if (ui.modal) {
    var m = ui.modal;
    if (k === 'ArrowDown' || k === 'ArrowUp' || k === 'ArrowLeft' || k === 'ArrowRight') { m.sel = (m.sel + 1) % m.options.length; return true; }
    if (k === 'Escape') { ui.modal = null; return true; }
    if (k === 'Enter') { ui.modal = null; if (m.options[m.sel].fn) m.options[m.sel].fn(); else say('Cancelled. Nothing was changed.'); return true; }
    return true;
  }
  if (ui.prompt) {
    if (k === 'Escape') { ui.prompt = null; return true; }
    if (k === 'Enter') {
      var el = document.getElementById('prompt-inp'), v = el ? el.value : '';
      var err = ui.prompt.ok(v);
      if (err) { ui.prompt.value = v; ui.prompt.err = err; } else ui.prompt = null;
      return true;
    }
    return false;
  }
  if (ui.screen === 'start') {
    if (move(k, ui.items.length)) return true;
    if (k === 'Enter') {
      var it = ui.items[ui.sel]; ui.msg = null;
      if (!it) return true;
      if (it.kind === 'profile') startSession(it.id);
      else if (it.kind === 'new') askNewAstronaut();
      else runCommand('import');
      return true;
    }
    return false;
  }
  if (ui.view === 'checkin' && ui.ci) {
    var c = ui.ci, ind = c.phase === 'ask' ? indById(c.steps[c.i]) : null;
    if (k === 'Escape') { setView('overview'); return true; }
    if (isAck && ui.pending.length) {                               /* letters are never an answer here, so A always acknowledges */
      var cur = document.getElementById('ci-inp'); if (cur) c.text = cur.value;
      acknowledge(); return true;
    }
    if (c.phase === 'done') { if (k === 'Enter') setView('overview'); return true; }
    if (c.phase === 'result') { if (k === 'Enter') ciNext(); return true; }
    if (ind.type === 'choice') {
      var n = ind.options.length + 1;
      if (k === 'ArrowDown') { c.sel = (c.sel + 1) % n; return true; }
      if (k === 'ArrowUp') { c.sel = (c.sel + n - 1) % n; return true; }
      if (/^[1-9]$/.test(k) && +k <= n) { c.sel = +k - 1; return true; }
      if (k === 'Enter') { ciConfirm(); return true; }
      return true;
    }
    if (k === 'Enter') { ciConfirm(); return true; }
    if (k.length === 1 && !/[0-9.,]/.test(k)) return 'block';       /* letters cannot be typed into a number */
    return false;                                                   /* digits, Backspace, etc. go to the input */
  }
  if (isAck && !inInput && ui.pending.length) { acknowledge(); return true; }
  if (/^[1-6]$/.test(k)) { setView(VIEWS[+k - 1].id); return true; }
  if (ui.card) {
    var cd = ui.card, len = cd.ids.length;
    if (k === 'Escape' || k === 'Backspace') { ui.card = null; return true; }
    if (k === 'ArrowRight' || k === 'ArrowDown') { cd.i = (cd.i + 1) % len; return true; }
    if (k === 'ArrowLeft' || k === 'ArrowUp') { cd.i = (cd.i + len - 1) % len; return true; }
    return false;
  }
  if (ui.view === 'checkin') { if (k === 'Enter') { startCheckin(); return true; } return false; }
  if (move(k, ui.items.length)) return true;
  if (k === 'Enter') {
    var x = ui.items[ui.sel];
    if (!x) return true;
    if (x.kind === 'ind') {
      var ids = ui.items.filter(function (y) { return y.kind === 'ind'; }).map(function (y) { return y.id; });
      ui.card = {ids: ids, i: ids.indexOf(x.id)};
    } else if (x.kind === 'checkin') { setView('checkin'); startCheckin(); }
    else if (x.cmd) { ui.msg = null; runCommand(x.cmd); }
    return true;
  }
  return false;
}
document.addEventListener('keydown', function (e) {
  if (crashed) { if (e.key === 'r' || e.key === 'R') location.reload(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  var t = e.target, inInput = !!(t && t.tagName === 'INPUT' && t.type !== 'file');
  var r = guard(function () { return handleKey(e.key, inInput); });
  if (r) e.preventDefault();
  if (r === true) render();
});
document.addEventListener('click', function (e) {
  if (crashed) return;
  var el = e.target;
  while (el && el !== document.body && !(el.getAttribute && el.getAttribute('data-click'))) el = el.parentNode;
  if (!el || el === document.body || !el.getAttribute) return;
  var cmd = el.getAttribute('data-click').split(':');
  guard(function () {
    if (cmd[0] === 'pick') {
      var i = +cmd[1];
      if (ui.modal) ui.modal.sel = i; else if (ui.view === 'checkin' && ui.ci && ui.screen === 'main') ui.ci.sel = i; else ui.sel = i;
      handleKey('Enter', false);
    } else handleKey(cmd[1], false);
  });
  render();
});
window.addEventListener('error', function (e) { crash(e && e.error); });
window.addEventListener('unhandledrejection', function (e) { crash(e && e.reason); });

guard(function () { loadStore(); });
render();
</script>
</body>
</html>
